<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tourisme Discret en France</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Top App Navigation Bar -->
        <header class="app-header custom-red-header">
            <h1 class="main-title">Titre : Dashboard Tourisme Discret en France</h1>
        </header>

        <!-- Main Dashboard Content Grid -->
        <main class="dashboard-grid-new">
            
            <!-- LEFT COLUMN -->
            <div class="col-left">
                
                <!-- Filtre Ville + Durée -->
                <div class="dash-card card-search" id="card-search">
                    <div class="card-header">
                        <h2 class="card-title">Filtre Ville + Durée</h2>
                    </div>
                    <form id="search-form" class="search-form" autocomplete="off">
                        <div class="form-inputs-row">
                            <div class="form-group autocomplete-group">
                                <label for="depart">Gare de départ</label>
                                <div class="input-with-icon">
                                    <span class="input-icon">📍</span>
                                    <input type="text" id="depart" placeholder="Ex: Paris..." required autocomplete="off" value="Paris">
                                    <input type="hidden" id="id_depart">
                                </div>
                                <ul class="autocomplete-list" id="depart-list"></ul>
                            </div>
                            <div class="form-group duration-group">
                                <div class="duration-label-row">
                                    <label for="max_duration">Durée max :</label>
                                    <span class="duration-display" id="duration-display">3h00 (180 min)</span>
                                </div>
                                <div class="duration-slider-container">
                                    <input type="range" id="max_duration" min="30" max="480" step="15" value="180">
                                </div>
                            </div>
                            <div class="form-submit-group">
                                <button type="submit" id="submit-btn" class="btn-primary">
                                    <span class="btn-spinner hidden" id="search-spinner"></span>
                                    <span class="btn-text">Rechercher</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Carte (Interactions & Sélection) -->
                <div class="dash-card card-map-new" id="card-map">
                    <div class="card-header" style="padding-bottom: 0.5rem;">
                        <h2 class="card-title">Carte des destinations</h2>
                    </div>
                    <div class="map-toolbar">
                        <span id="map-route-text" class="route-text">En attente de recherche...</span>
                    </div>

                    <!-- Bandeau Train Sélectionné -->
                    <div id="train-detail-card" class="train-detail-card hidden">
                        <div class="train-detail-row">
                            <div class="train-badges-group" id="train-badges-group"></div>
                            <div class="train-summary-times" id="train-summary-times"></div>
                            <div class="train-transfers-info" id="train-transfers-info"></div>
                        </div>
                        <div id="train-steps-breakdown" class="train-steps-breakdown"></div>
                    </div>

                    <div id="leaflet-map" class="leaflet-map-new"></div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="col-right">
                
                <!-- GRAPH comparaison ecologique -->
                <div class="dash-card card-eco-new" id="card-eco">
                    <div class="card-header">
                        <h2 class="card-title">Comparaison écologique (kg CO₂)</h2>
                    </div>
                    <div class="canvas-container">
                        <div id="ecoChart" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>

                <!-- PROFIL & ALTERNATIVES -->
                <div class="bottom-split-cards">
                    <!-- PROFIL DES ACTIVITÉS -->
                    <div class="dash-card card-radar">
                        <div class="card-header">
                            <h2 class="card-title">PROFIL DES ACTIVITÉS (Radar Chart)</h2>
                        </div>
                        <div class="canvas-container-radar">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <!-- ALTERNATIVES CALMES PROCHES -->
                    <div class="dash-card card-alternatives">
                        <div class="card-header">
                            <h2 class="card-title">ALTERNATIVES CALMES PROCHES</h2>
                        </div>
                        <ul class="alternatives-list" id="alternatives-list">
                            <!-- Dynamically populated -->
                            <li class="alt-item empty">Aucune alternative</li>
                        </ul>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
